<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Música Profesional</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="contenedor-reproductor">
        <h2>Mi Reproductor</h2>

        <!-- Selectores de archivos -->
        <div class="seccion-carga">
            <div class="grupo-input">
                <label for="inputCarpeta">📁 Cargar Carpeta:</label>
                <input type="file" id="inputCarpeta" webkitdirectory directory multiple>
            </div>
            
            <div class="grupo-input">
                <label for="inputArchivos">🎵 Agregar Canciones:</label>
                <input type="file" id="inputArchivos" accept="audio/*" multiple>
            </div>
        </div>

        <!-- Controles de Reproducción -->
        <div class="controles-principales">
            <button id="btnPlayPausa" class="btn-control">▶ Play</button>
            <button id="btnSiguiente" class="btn-control">⏭ Siguiente</button>
            <button id="btnAleatorio" class="btn-secundario">🔀 (Activo)</button>
            <button id="btnLimpiar" class="btn-peligro">Borrar Lista</button>
        </div>

        <div class="info-cancion">
            <div id="nombreCancion">Esperando música...</div>
        </div>
        <!-- Barra de progreso y tiempo -->
        <div class="progreso-contenedor" id="progresoContenedor">
            <div class="barra-progreso" id="barraProgreso"></div>
        </div>
        <div id="tiempo" class="texto-tiempo">0:00 / 0:00</div>

        <!-- Lista de canciones -->
        <h3>Lista de Reproducción Actual</h3>
        <ul id="listaCanciones" class="lista-canciones"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
