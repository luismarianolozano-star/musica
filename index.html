<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reproductor de Música</title>
    <!-- Vinculamos el archivo de estilos externos -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <!-- COLUMNA IZQUIERDA: REPRODUCTOR -->
    <div class="container-reproductor">
        <h2>Mi Reproductor</h2>
        <p>Selecciona tu carpeta de música:</p>
        
        <label class="btn-carpeta">
            📁 Abrir Carpeta Local
            <input type="file" id="inputCarpeta" webkitdirectory directory multiple accept="audio/*" onchange="cargarCarpeta(event)">
        </label>

        <div class="info-cancion">
            <div id="nombreCancion">Esperando música...</div>
        </div>

        <div class="progreso-container">
            <span class="tiempo" id="tiempoActual">0:00</span>
            <input type="range" class="barra-progreso" id="barraProgreso" value="0" min="0" max="100" oninput="cambiarTiempoManual()">
            <span class="tiempo" id="tiempoTotal">0:00</span>
        </div>

        <div class="controles">
            <button class="btn-control btn-secundario" onclick="reproducirSiguiente()">🔀 Siguiente</button>
            <button class="btn-control" id="btnPlayPause" onclick="alternarPlayPause()">▶ Play</button>
        </div>
    </div>

    <!-- COLUMNA DERECHA: LISTA DE CANCIONES -->
    <div class="container-lista">
        <h3>Lista de Canciones (<span id="contadorLista">0</span>)</h3>
        <div class="lista-scroll" id="listaCancionesUI">
            <!-- Las canciones se inyectarán dinámicamente desde JS -->
        </div>
    </div>
</div>

<!-- Vinculamos el archivo de lógica JavaScript -->
<script src="script.js"></script>
</body>
</html>
